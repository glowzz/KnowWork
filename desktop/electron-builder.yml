# 桌面端的打包配置（M6 才接交付；这里先把 Mac/Win 两个安装包的目标定下来）。
# 这一版安装包不签名：Mac 第一次打开要在「系统设置 → 隐私与安全性」里放行，Windows 提示「未知发布者」。
appId: com.knowwork.desktop
productName: KnowWork 桌面端
directories:
  output: release
files:
  - src/**/*
  - package.json
  - "!tests/**"
  - "!release/**"
protocols:
  - name: KnowWork
    schemes:
      - knowwork
mac:
  target:
    - { target: dmg, arch: [arm64] }
    - { target: zip, arch: [arm64] }
  category: public.app-category.productivity
  identity: null
win:
  target:
    - { target: nsis, arch: [x64] }
    - { target: zip, arch: [x64] }
